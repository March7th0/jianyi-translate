<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简译</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 360px; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328; background: #fff; }
  header { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 8px; }
  header h1 { font-size: 16px; color: #1677ff; }
  header .sub { font-size: 11px; color: #8a8f99; }
  section { padding: 0 14px 10px; }
  textarea { width: 100%; height: 72px; border: 1px solid #d9d9d9; border-radius: 8px; padding: 8px 10px; font-size: 13px; resize: vertical; outline: none; font-family: inherit; }
  textarea:focus { border-color: #1677ff; }
  .out { min-height: 54px; margin-top: 8px; background: #f5f7fa; border: 1px solid #eef0f3; border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
  .meta { margin-top: 4px; font-size: 11px; color: #8a8f99; min-height: 14px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 0 14px 10px; font-size: 13px; }
  .row .lbl { width: 64px; color: #57606a; flex: none; }
  select { flex: 1; height: 30px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 6px; background: #fff; outline: none; }
  .seg { display: flex; gap: 12px; }
  .seg label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .chk { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .actions { display: flex; gap: 10px; padding: 2px 14px 12px; }
  button { flex: 1; height: 34px; border: 1px solid #1677ff; border-radius: 8px; background: #1677ff; color: #fff; font-size: 13px; cursor: pointer; }
  button.ghost { background: #fff; color: #1677ff; }
  button:hover { opacity: .92; }
  footer { padding: 8px 14px 12px; font-size: 11px; color: #8a8f99; border-top: 1px solid #f0f1f3; line-height: 1.8; }
  .hint { color: #1677ff; cursor: pointer; }
</style>
</head>
<body>
  <header><h1>简译</h1><span class="sub">有道/DeepL/MyMemory · 国内直连 · 免翻墙</span></header>

  <section>
    <textarea id="input" placeholder="输入要翻译的文字，按 Enter 翻译（Shift+Enter 换行）"></textarea>
    <div id="output" class="out">—</div>
    <div id="meta" class="meta"></div>
  </section>

  <div class="row"><span class="lbl">目标语言</span>
    <select id="target">
      <option value="zh-Hans">简体中文</option>
      <option value="zh-TW">繁体中文</option>
      <option value="en">English 英语</option>
      <option value="ja">日本語 日语</option>
      <option value="ko">한국어 韩语</option>
      <option value="fr">Français 法语</option>
      <option value="de">Deutsch 德语</option>
      <option value="ru">Русский 俄语</option>
      <option value="es">Español 西班牙语</option>
      <option value="pt">Português 葡萄牙语</option>
      <option value="it">Italiano 意大利语</option>
      <option value="th">ไทย 泰语</option>
      <option value="vi">Tiếng Việt 越南语</option>
      <option value="ar">العربية 阿拉伯语</option>
    </select>
  </div>

  <div class="row"><span class="lbl">页面模式</span>
    <div class="seg">
      <label><input type="radio" name="mode" value="replace" checked>仅译文</label>
      <label><input type="radio" name="mode" value="bilingual">双语对照</label>
    </div>
  </div>

  <div class="row"><label class="chk"><input type="checkbox" id="showBubble" checked>选中文字后显示“译”按钮</label></div>

  <div class="row"><label class="chk"><input type="checkbox" id="autoRestore" checked>再次打开本页时自动恢复翻译</label></div>

  <div class="actions">
    <button id="translatePage">翻译本页</button>
    <button id="restorePage" class="ghost">恢复原文</button>
    <button id="testEngine" class="ghost">测试服务</button>
  </div>

  <footer>
    划词：选中文字 → 点“译”按钮 或按 <b>Alt+T</b><br>
    整页：按 <b>Alt+P</b> 或点上方按钮，右键菜单也可用<br>
    引擎：有道 → DeepL → MyMemory 自动切换<br>
    <span id="openShortcuts" class="hint">修改快捷键 →</span>
  </footer>

<script src="popup.js"></script>
</body>
</html>
